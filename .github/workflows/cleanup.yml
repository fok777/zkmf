name: 每周清理

on:
  schedule:
    # cron 按 UTC 执行
    # UTC 周六 19:00 = 北京时间周日 03:00
    - cron: '0 19 * * 6'
  workflow_dispatch:
    inputs:
      retain_days:
        description: '保留最近多少天的运行记录（更早的删除）'
        type: string
        default: '7'
      keep_runs:
        description: '每个 workflow 至少保留几条运行记录'
        type: string
        default: '3'
      keep_caches:
        description: '保留最近使用的几个缓存（0 = 全删）'
        type: string
        default: '1'
      dry_run:
        description: '仅统计不删除（演练）'
        type: boolean
        default: false

# 删除运行记录和缓存都需要 actions: write
permissions:
  contents: read
  actions: write

# 同一时间只跑一个清理任务，新任务排队不打断
concurrency:
  group: cleanup-runs-caches
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    env:
      RETAIN_DAYS: '7'
      KEEP_RUNS: '3'
      KEEP_CACHES: '1'

    steps:
    # runner 镜像已预装 gh CLI，无需安装（实测确认）
    # 保留自检：万一哪天镜像变了，这里会立刻暴露
    - name: 环境自检
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set +e
        echo "gh 版本: $(gh --version | head -1)"
        echo "仓库: ${GITHUB_REPOSITORY}"
        echo "token 权限:"
        gh api "repos/${GITHUB_REPOSITORY}" --jq '.permissions' 2>&1
        echo "（若 actions 为 write 即具备删除权限）"
        exit 0

    - name: 清理旧的运行记录
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        IN_RETAIN: ${{ github.event.inputs.retain_days }}
        IN_KEEP: ${{ github.event.inputs.keep_runs }}
        IN_DRY: ${{ github.event.inputs.dry_run }}
      run: |
        set +e
        SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"
        R="${IN_RETAIN:-${RETAIN_DAYS}}"; R="${R:-7}"
        K="${IN_KEEP:-${KEEP_RUNS}}"; K="${K:-3}"
        echo "策略：保留最近 ${R} 天，且每个 workflow 至少留 ${K} 条"

        CUTOFF=$(date -u -d "${R} days ago" +%Y-%m-%d)
        echo "截止日期: ${CUTOFF}"

        # 只拉「已完成」且「早于截止日」的记录，量小很多
        # URL 里的 < 必须编码成 %3C
        gh api --paginate \
          "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100&status=completed&created=%3C${CUTOFF}" \
          --jq '.workflow_runs[] | "\(.id) \(.created_at)"' > /tmp/runs.txt 2>/tmp/runs.err
        if [ $? -ne 0 ]; then
          echo "::warning::拉取运行记录失败"
          cat /tmp/runs.err
          : > /tmp/runs.txt
        fi

        # 用 wc -l 而非 grep -c：空文件下 grep 返回 1，
        # 配合 || echo 0 会输出两行，写进 GITHUB_OUTPUT 是非法格式
        TOTAL=$(wc -l < /tmp/runs.txt | tr -d ' ' || true)
        TOTAL="${TOTAL:-0}"
        echo "符合删除条件: ${TOTAL} 条"

        # 每个 workflow 的保底条数：从最新记录里数，够 K 条才允许删
        # 这里简化为总量保底：不足 K 条时一条都不删
        if [ "${TOTAL}" -le "${K}" ]; then
          echo "总数 ${TOTAL} 未超过保底 ${K}，跳过删除"
          echo "- 运行记录：无需清理（${TOTAL} 条）" >> "${SUMMARY}"
          exit 0
        fi

        if [ "${IN_DRY}" = "true" ]; then
          echo "演练模式：跳过删除"
          echo "- 运行记录：演练，待删 ${TOTAL} 条" >> "${SUMMARY}"
          exit 0
        fi

        OK=0; FAIL=0
        while read -r id created; do
          [ -n "${id:-}" ] || continue
          if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" >/dev/null 2>&1; then
            OK=$(( OK + 1 ))
          else
            FAIL=$(( FAIL + 1 ))
            echo "  ❌ run ${id}（${created}）删除失败"
          fi
        done < /tmp/runs.txt

        echo "运行记录：删除成功 ${OK} 条，失败 ${FAIL} 条"
        echo "- 运行记录：删除 ${OK} 条，失败 ${FAIL} 条" >> "${SUMMARY}"
        # 一条都没删掉，几乎必是权限问题
        if [ "${FAIL}" -gt 0 ] && [ "${OK}" -eq 0 ]; then
          echo "::error::全部删除失败 —— 检查 Settings → Actions → General → Workflow permissions 是否为 Read and write"
        fi
        exit 0

    - name: 清理 Actions 缓存
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        IN_KEEP_CACHE: ${{ github.event.inputs.keep_caches }}
        IN_DRY: ${{ github.event.inputs.dry_run }}
      run: |
        set +e
        SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"
        KC="${IN_KEEP_CACHE:-${KEEP_CACHES}}"; KC="${KC:-1}"
        echo "策略：保留最近使用的 ${KC} 个缓存"

        gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
          --jq '.actions_caches[] | "\(.id)\t\(.key)\t\(.size_in_bytes)"' > /tmp/caches.tsv 2>/tmp/caches.err
        if [ $? -ne 0 ]; then
          echo "拉取缓存列表失败"
          cat /tmp/caches.err
          echo "- 缓存：拉取失败" >> "${SUMMARY}"
          exit 0
        fi

        TOTAL=$(wc -l < /tmp/caches.tsv | tr -d ' ' || true)
        TOTAL="${TOTAL:-0}"
        echo "当前缓存: ${TOTAL} 个"

        # 没有缓存时 total 为 0，jq 空输入会报错，先挡掉
        if [ "${TOTAL}" -eq 0 ]; then
          echo "没有缓存，无需清理"
          echo "- 缓存：0 个，无需清理" >> "${SUMMARY}"
          exit 0
        fi

        # 按最近访问时间倒序，保留前 KC 个
        gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
          --jq "[.actions_caches[]
                 | {id, key, t: (.last_accessed_at // .created_at // \"\")}]
                | sort_by(.t) | reverse | .[${KC}:][] | \"\(.id)\t\(.key)\"" \
          > /tmp/to_delete.tsv 2>/dev/null || : > /tmp/to_delete.tsv

        DEL=$(wc -l < /tmp/to_delete.tsv | tr -d ' ' || true)
        DEL="${DEL:-0}"
        echo "待删除: ${DEL} 个"

        if [ "${IN_DRY}" = "true" ]; then
          echo "演练模式：跳过删除"
          echo "- 缓存：演练，待删 ${DEL} 个" >> "${SUMMARY}"
          exit 0
        fi

        OK=0; FAIL=0
        while IFS=$'\t' read -r id key; do
          [ -n "${id:-}" ] || continue
          # -i 让 gh 输出响应头，用于区分失败原因
          out=$(gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${id}" -i 2>&1)
          case "$(printf '%s' "${out}" | head -n1)" in
            *204*|*200*)
              echo "  ✅ ${id}  ${key}"; OK=$(( OK + 1 )) ;;
            *400*)
              echo "  ⏭ ${id}  ${key}（被运行中 job 占用，下轮再删）" ;;
            *404*)
              echo "  ⚠️ ${id}  已不存在" ;;
            *)
              echo "  ❌ ${id}  ${key} → $(printf '%s' "${out}" | head -n1)"; FAIL=$(( FAIL + 1 )) ;;
          esac
        done < /tmp/to_delete.tsv

        echo "缓存：删除成功 ${OK} 个，失败 ${FAIL} 个"
        echo "- 缓存：删除 ${OK} 个，失败 ${FAIL} 个" >> "${SUMMARY}"
        exit 0
