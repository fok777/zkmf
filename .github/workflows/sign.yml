name: MT 自动签到

on:
  schedule:
    # GitHub Actions 的 cron 按 UTC 执行
    # 北京 00:07 = UTC 16:07
    # 北京 08:13 = UTC 00:13
    - cron: '7 16 * * *'
    - cron: '13 0 * * *'
  workflow_dispatch:
    inputs:
      skip_delay:
        description: '跳过随机延迟（立即签到），默认开'
        type: boolean
        default: true
      use_warp:
        description: '挂 Cloudflare WARP 换出口 IP'
        type: boolean
        default: true
      smoke:
        description: '只做连通性自检，不签到（排查 WAF/代理用）'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

env:
  # 定时触发的随机延迟上限（分钟）
  MAX_DELAY_MIN: '15'

jobs:
  sign:
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-node@v5
      with:
        node-version: '24'

    # 默认常开，把出口换成 Cloudflare 的 IP。
    # 只在手动触发时把 use_warp 取消勾选才会跳过。
    - name: 挂 Cloudflare WARP 换出口 IP
      if: ${{ github.event.inputs.use_warp != 'false' }}
      continue-on-error: true
      timeout-minutes: 8
      run: |
        set +e
        curl -fsSL --max-time 20 https://pkg.cloudflareclient.com/pubkey.gpg \
          | sudo gpg --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ jammy main" \
          | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
        sudo apt-get update -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/cloudflare-client.list \
          -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0" 2>&1 | tail -3
        sudo apt-get install -y cloudflare-warp 2>&1 | tail -3 || { echo "WARP 装不上，按原出口直连"; exit 0; }

        warp-cli --accept-tos registration new 2>&1 | tail -2
        warp-cli --accept-tos mode warp 2>&1 | tail -2
        warp-cli --accept-tos connect 2>&1 | tail -2
        sleep 4
        warp-cli --accept-tos status 2>&1 | tail -3

        echo "--- 当前出口 ---"
        curl -s --max-time 15 https://cloudflare.com/cdn-cgi/trace | grep -E "^(ip|warp|colo)=" || true
        echo "--- 目标站连通性 ---"
        curl -s -o /dev/null -w "bbs.binmt.cc -> HTTP %{http_code} 连接 %{time_connect}s\n" \
          --max-time 25 -4 -A 'Mozilla/5.0 (Linux; Android 11; SM-G975F) Chrome/116.0.0.0 Mobile Safari/537.36' \
          https://bbs.binmt.cc/k_misign-sign.html || echo "目标站仍不可达"
        exit 0

    - name: 签到
      id: sign
      continue-on-error: true
      env:
        ACCOUNTS: ${{ secrets.ACCOUNTS }}
        BBS_COOKIE: ${{ secrets.BBS_COOKIE }}
        # 代理池：每行一个，如 http://user:pass@1.2.3.4:8080，失败自动轮换
        PROXIES: ${{ secrets.PROXIES }}
        HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
        MT_DEBUG: ${{ vars.MT_DEBUG }}
        MT_SMOKE: ${{ github.event.inputs.smoke == true && '1' || '' }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        # 默认跳过随机延迟、立即签到（定时触发也一样）。
        # 想恢复随机延迟：手动触发时把 skip_delay 取消勾选。
        SKIP_DELAY: ${{ github.event.inputs.skip_delay == 'false' && '' || '1' }}
        MAX_DELAY_MIN: ${{ env.MAX_DELAY_MIN }}
      run: |
        node -v
        node sign.js 2>&1 | tee /tmp/sign.log

    - name: 签到结果
      if: ${{ always() }}
      run: |
        SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"
        LOG=/tmp/sign.log
        if grep -qE '全部账号签到完成' "${LOG}" 2>/dev/null; then
          echo "## ✅ 签到成功" >> "${SUMMARY}"
          exit 0
        fi

        if [ ! -s "${LOG}" ]; then
          REASON="脚本未产生日志，可能超时被杀"
        elif grep -qE '账号或密码有误|密码错误|用户名.*不正确' "${LOG}"; then
          REASON="账号或密码有误 —— 去 Settings → Secrets → ACCOUNTS 核对"
        elif grep -qE '未取到 formhash（已试 3 个候选页' "${LOG}"; then
          REASON="登录页拿不到 formhash —— 拿到的一直是 WAF 挑战页，多半要挂国内代理"
        elif grep -qE '多次请求仍被 WAF 拦截|没解出来' "${LOG}"; then
          REASON="被阿里云 ESA 挑战挡住，acw_sc__v2 没解出来 —— 下载 debug 快照看挑战页长什么样"
        elif grep -qE 'timeout|ETIMEDOUT|ECONNREFUSED|EAI_AGAIN|socket hang|CONNECT' "${LOG}"; then
          REASON="网络/代理不通 —— 检查 PROXIES 里的代理是否还活着"
        elif grep -qE '未能从签到页取到 formhash' "${LOG}"; then
          REASON="登录成功但签到页没 formhash —— Cookie 没生效或站点改版"
        elif grep -qE '缺少环境变量 ACCOUNTS' "${LOG}"; then
          REASON="Secret ACCOUNTS 未设置"
        else
          REASON="未知原因，看下面日志尾部"
        fi

        echo "::error::签到失败：${REASON}"
        {
          echo "## ❌ 签到失败"
          echo
          echo "**原因**：${REASON}"
          echo
          echo "<details><summary>日志尾部</summary>"
          echo
          echo '```'
          tail -40 "${LOG}" 2>/dev/null
          echo '```'
          echo
          echo "</details>"
        } >> "${SUMMARY}"

    # 每次响应都会存一份到 debug/，排查 WAF 时把它下载下来直接看
    - name: 上传调试快照
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: sign-debug-${{ github.run_number }}
        path: debug/*.html
        if-no-files-found: ignore
        retention-days: 3
