name: MT 自动签到

on:
  schedule:
    # GitHub Actions 的 cron 按 UTC 执行
    # 北京 00:07 = UTC 16:07
    # 北京 08:13 = UTC 00:13
    - cron: '7 16 * * *'
    - cron: '13 0 * * *'
  workflow_dispatch:
    inputs:
      skip_delay:
        description: '跳过随机延迟（立即签到）'
        type: boolean
        default: true

permissions:
  contents: read

env:
  # 定时触发的随机延迟上限（分钟）。GitHub 的 schedule 本身会晚 5~30 分钟，
  # 再加一点点抖动就够打散特征了，别设太大，否则会撞上 job 超时
  MAX_DELAY_MIN: '15'

jobs:
  sign:
    runs-on: ubuntu-26.04
    # 延迟最多 15 分钟 + 单请求超时 120s × 重试 4 次 × 整体 4 轮，留足余量
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '24'

    # GitHub Runner 的 Azure 出口 IP 常被目标站丢包。
    # 挂 WARP 把出口换成 Cloudflare 的 IP；失败就按原出口直连，不阻塞。
    - name: 挂 Cloudflare WARP 换出口 IP
      continue-on-error: true
      run: |
        set +e
        curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
          | sudo gpg --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
        for c in noble jammy; do
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ ${c} main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          if sudo apt-get update -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/cloudflare-client.list \
               -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0" >/dev/null 2>&1 \
             && apt-cache policy cloudflare-warp 2>/dev/null | grep -q Candidate:[[:space:]][0-9]; then
            break
          fi
        done
        sudo apt-get install -y cloudflare-warp >/dev/null 2>&1 || { echo "WARP 装不上，按原出口直连"; exit 0; }
        warp-cli --accept-tos registration new >/dev/null 2>&1
        warp-cli --accept-tos mode warp >/dev/null 2>&1
        warp-cli --accept-tos connect >/dev/null 2>&1
        sleep 4
        curl -s --max-time 10 https://cloudflare.com/cdn-cgi/trace | grep -E "^(warp|colo)=" || true
        exit 0

    - name: 签到
      id: sign
      continue-on-error: true
      env:
        ACCOUNTS: ${{ secrets.ACCOUNTS }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        SKIP_DELAY: ${{ github.event.inputs.skip_delay == 'true' && '1' || '' }}
        MAX_DELAY_MIN: ${{ env.MAX_DELAY_MIN }}
      run: node sign.js 2>&1 | tee /tmp/sign.log

    - name: 签到结果
      if: ${{ always() }}
      run: |
        SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"
        LOG=/tmp/sign.log
        if grep -qE '全部账号签到完成|✅ 签到完成|签到完成:' "${LOG}" 2>/dev/null; then
          echo "## ✅ 签到成功" >> "${SUMMARY}"
          exit 0
        fi

        if [ ! -s "${LOG}" ]; then
          REASON="脚本未产生日志，可能超时被杀"
        elif grep -qE '账号或密码有误|密码错误|用户名.*不正确' "${LOG}"; then
          REASON="账号或密码有误 —— 去 Settings → Secrets → ACCOUNTS 核对"
        elif grep -qE '被 WAF 拦截|acw_sc__v2' "${LOG}"; then
          REASON="被阿里云 ESA 挑战挡住，acw_sc__v2 未还原"
        elif grep -qE 'timeout|ETIMEDOUT|ECONNREFUSED|EAI_AGAIN|socket hang' "${LOG}"; then
          REASON="网络超时 —— 出口 IP 到目标站不通（WARP 也没绕过去）"
        elif grep -qE '登录未确认|会话失效|未能从签到页取到 formhash' "${LOG}"; then
          REASON="登录成功但签到未确认 —— Cookie 未生效或站点改了返回格式"
        elif grep -qE '缺少环境变量 ACCOUNTS' "${LOG}"; then
          REASON="Secret ACCOUNTS 未设置"
        else
          REASON="未知原因，看下面日志尾部"
        fi

        echo "::error::签到失败：${REASON}"
        {
          echo "## ❌ 签到失败"
          echo
          echo "**原因**：${REASON}"
          echo
          echo "<details><summary>日志尾部</summary>"
          echo
          echo '```'
          tail -30 "${LOG}" 2>/dev/null
          echo '```'
          echo
          echo "</details>"
        } >> "${SUMMARY}"
